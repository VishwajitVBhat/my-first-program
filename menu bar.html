<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamburger Menu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            padding: 1rem;
        }

        .navbar h1 {
            color: #fff;
            margin: 0;
        }

        .menu {
            display: none;
            flex-direction: column;
            align-items: center;
            background-color: #333;
            width: 100%;
            position: absolute;
            top: 60px;
            left: 0;
        }

        .menu a {
            color: white;
            padding: 1rem;
            text-decoration: none;
            text-align: center;
            width: 100%;
        }

        .menu a:hover {
            background-color: #575757;
        }

        .hamburger {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            width: 25px;
            height: 25px;
        }

        #bar {
            height: 3px;
            margin: 6px 0;
            width: 20px;
            background-color: #fff;
        }

        @media(min-width: 768px) {
            .menu {
                display: flex;
                flex-direction: row;
                position: static;
                width: auto;
            }

            .hamburger {
                display: none;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>My Website</h1>
        <div class="hamburger" onclick="toggleMenu()">
            <div id="bar"></div>
            <div id="bar"></div>
            <div id="bar"></div>
        </div>
        <div class="menu" id="menu">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('menu');
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }
    </script>
</body>
</html>
