<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Calculator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d; /* Dark Black */
            color: #ffffff; /* White text */
            font-family: 'Poppins', sans-serif;
        }
        header {
            background-color: #1a1a1a; /* Dark Gray */
            padding: 20px;
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            border-bottom: 2px solid #333;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
            text-align: center;
        }
        .tagline {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #bbbbbb;
        }
        .btn {
            background-color: #0077ff;
            color: white;
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
            text-decoration: none;
        }
        .btn:hover {
            background-color: #005fd1;
        }
        footer {
            text-align: center;
            padding: 15px;
            font-size: 0.9rem;
            color: #555;
            border-top: 1px solid #333;
            background-color: #1a1a1a;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        AI-Powered Calculator
    </header>
    <main>
        <div class="tagline">
            Solve Math, Physics, and Civil Problems in Seconds ✨
        </div>
        <a href="/login" class="btn">Get Started</a>
    </main>
    <footer>
        &copy: 2025 AI-Powered Calculator. All rights reserved.
    </footer>
</body>
</html>
